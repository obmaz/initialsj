		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#07111e">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

		<style>
:root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body { color: #f3f8ff; background: #07111e; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
html:fullscreen, html:-webkit-full-screen { width:100%; height:100%; }
html.installed-game, html.installed-game body { height:100dvh; }
#fullscreen-control { position:fixed; z-index:3; margin:0; padding:0; border:0; color:transparent; background:transparent; cursor:pointer; font-size:0; }
#fullscreen-control[hidden] { display:none; }
#fullscreen-control:focus-visible { outline:3px solid #ffbc59; outline-offset:-4px; }
#context-notice { position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center; flex-direction:column; gap:18px; padding:24px; box-sizing:border-box; color:#f5f8ff; background:#06111ef2; font:600 18px/1.6 system-ui,sans-serif; text-align:center; }
#context-notice button { min-height:48px; padding:0 28px; border:0; border-radius:8px; color:#04121f; background:#36dfff; font:800 18px system-ui,sans-serif; cursor:pointer; }
#fullscreen-notice { position:fixed; z-index:5; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); transform:translateX(-50%); width:max-content; max-width:min(640px,85vw); box-sizing:border-box; padding:12px 18px; border:1px solid #49d9f180; border-radius:6px; color:#e9f6fd; background:#0b2032f2; font:600 15px/1.5 system-ui,sans-serif; text-align:center; box-shadow:0 8px 32px #0005; }
#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: $GODOT_SPLASH_COLOR; z-index: 2; }
#landscape-guide { display: none; position: fixed; inset: 0; z-index: 4; background: #07111e; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 24px; box-sizing: border-box; }
#landscape-guide svg { width: 168px; height: 120px; }
#landscape-guide h2 { margin: 0; font-size: clamp(22px,6vw,30px); font-style: italic; letter-spacing: .04em; }
#landscape-start { min-height: 52px; width: min(280px,80vw); border: 1px solid #a9f2ff; border-radius: 5px; background: #39d7f3; color: #07111e; font: 800 16px system-ui,sans-serif; cursor: pointer; }
#landscape-start:focus-visible { outline: 3px solid #ff9756; outline-offset: 5px; }
#landscape-start:disabled { opacity: .65; cursor: wait; }
#landscape-guide p { margin: 0; max-width: 290px; color: #bad1df; font-size: 15px; line-height: 1.6; }
@media (orientation: portrait) { #landscape-guide { display: flex; } }
#status-splash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#status-splash.show-image--false { display: none; }
#status-splash.use-filter--false { image-rendering: pixelated; }
.loading-brand { position:absolute; top:max(24px,env(safe-area-inset-top)); left:5vw; z-index:1; color:#f7fbff; font:bold italic clamp(28px,4.2vw,60px)/.95 system-ui,sans-serif; letter-spacing:-.04em; text-shadow:0 3px 18px #06172fe6; }
.loading-logo { display:block; width:clamp(190px,30vw,440px); height:auto; filter:drop-shadow(0 6px 18px #06172fcc); }
#loading-card { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); width: min(420px, 76vw); padding: 18px 22px; border: 1px solid #76dfff40; border-radius: 4px; background: #07111ee8; box-shadow: 0 10px 36px #0008; }
.loading-meta { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 12px; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
#loading-percent { color: #66e5ff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#status-progress { display: block; width: 100%; height: 4px; border: 0; border-radius: 1px; overflow: hidden; background: #263c51; color: #36dfff; accent-color: #36dfff; }
#status-progress::-webkit-progress-bar { background: #263c51; border-radius: 1px; }
#status-progress::-webkit-progress-value { background: linear-gradient(90deg,#168aff,#35dbff,#b2faff); border-radius: 1px; }
#status-progress::-moz-progress-bar { background: linear-gradient(90deg,#168aff,#35dbff,#b2faff); border-radius: 1px; }
#status-progress:indeterminate { background: linear-gradient(90deg,#263c51 0%,#36dfff 50%,#263c51 100%); background-size: 200% 100%; animation: load-sweep 1.6s linear infinite; }
#status-notice { display: none; position: relative; z-index: 1; max-width: 560px; margin: 24px; padding: 22px; border: 1px solid #ff987080; border-radius: 12px; color: #f5f8ff; background: #07111ef5; line-height: 1.5; overflow-wrap: anywhere; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
noscript { position: fixed; z-index: 3; bottom: 20px; left: 20px; right: 20px; padding: 16px; background: #07111e; text-align: center; }
@keyframes load-sweep { to { background-position: -200% 0; } }
@media (max-height: 500px) { #loading-card { bottom: max(12px, env(safe-area-inset-bottom)); padding: 11px 16px; } .loading-meta { margin-bottom: 8px; font-size: 10px; } }
@media (prefers-reduced-motion: reduce) { #status-progress { animation: none !important; } }

#install-dialog { color:#f4f8fb; background:#0d2132; border:1px solid #4bdcf1; border-radius:16px; padding:28px; width:min(560px,85vw); font-family:system-ui,sans-serif; box-shadow:0 20px 80px #0009; }
#install-dialog::backdrop { background:#020b16c9; }
#install-dialog h2 { margin:0 0 18px; font-size:clamp(22px,4vw,30px); }
#install-dialog p { color:#d0e2ee; line-height:1.7; font-size:17px; margin:0 0 24px; }
#install-dialog menu { display:flex; gap:14px; padding:0; margin:0; justify-content:flex-end; }
#install-dialog button { min-height:52px; min-width:110px; padding:12px 22px; font:700 18px system-ui,sans-serif; border:0; border-radius:8px; cursor:pointer; color:#092031; background:#4bdcf1; }
#install-dialog button.secondary { color:#e0eef6; background:#294358; }

</style>

		<script>
// Keep the active tour paused while the landscape-only layout is covered.
(function () {
	const portrait = window.matchMedia('(orientation: portrait)');
	const button = document.getElementById('landscape-start');
	const message = document.getElementById('landscape-status');
	const prompt = message.textContent;
	let observer = null;
	window.initialsjObserveOrientation = function (callback) {
		observer = callback;
		if (observer) observer(portrait.matches);
	};
	portrait.addEventListener('change', function (event) {
		if (observer) observer(event.matches);
		if (!event.matches || !button.disabled) message.textContent = prompt;
	});
	function waitForLandscape() {
		if (!portrait.matches) return Promise.resolve(true);
		return new Promise(function (resolve) {
			function changed(event) { if (!event.matches) finish(true); }
			function finish(ok) {
				clearTimeout(timeout);
				portrait.removeEventListener('change', changed);
				resolve(ok);
			}
			const timeout = setTimeout(function () { finish(false); }, 2000);
			portrait.addEventListener('change', changed);
		});
	}
	button.addEventListener('click', async function (event) {
		event.preventDefault();
		event.stopPropagation();
		if (button.disabled) return;
		button.disabled = true;
		button.textContent = '전환 중…';
		message.textContent = '가로 화면으로 전환하고 있어요.';
		let enteredFullscreen = false;
		try {
			const root = document.documentElement;
			const request = root.requestFullscreen || root.webkitRequestFullscreen;
			if (!document.fullscreenElement && !document.webkitFullscreenElement && request) {
				try {
					await request.call(root, {navigationUI: 'hide'});
					enteredFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
				} catch (_) { /* A standalone browser may still support orientation lock. */ }
			}
			let locked = false;
			if (screen.orientation && typeof screen.orientation.lock === 'function') {
				try { await screen.orientation.lock('landscape'); locked = true; } catch (_) { /* Manual rotation remains available. */ }
			}
			const landscape = !portrait.matches || (locked && await waitForLandscape());
			if (landscape) {
				message.textContent = prompt;
			} else {
				// Restore browser controls if fullscreen did not achieve rotation.
				const exit = document.exitFullscreen || document.webkitExitFullscreen;
				if (enteredFullscreen && exit) { try { await exit.call(document); } catch (_) {} }
				message.textContent = '자동 전환을 사용할 수 없어요. 기기를 직접 가로로 돌려 주세요.';
			}
		} catch (_) {
			message.textContent = '기기를 직접 가로로 돌려 주세요.';
		} finally {
			button.disabled = false;
			button.textContent = '가로로 시작';
		}
	});
}());

  const control = document.getElementById('fullscreen-control');
  const notice = document.getElementById('fullscreen-notice');
  const fullscreenMode = window.matchMedia('(display-mode: fullscreen)');
  const standaloneMode = window.matchMedia('(display-mode: standalone)');
  let rect = null;
  let busy = false;
  let noticeTimer = null;
  let observer = null;
  let lastFullscreen = null;
  let lastDomFullscreen = null;
  function activeElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function appMode() { return fullscreenMode.matches || standaloneMode.matches || navigator.standalone === true; }
  function showNotice(message) {
    clearTimeout(noticeTimer);
    notice.textContent = message;
    notice.hidden = false;
    noticeTimer = setTimeout(function () { notice.hidden = true; }, 4200);
  }
  window.initialsjIsFullscreen = function () { return !!activeElement() || fullscreenMode.matches; };
  window.initialsjFullscreenLabel = function () {
    if (activeElement()) return 'EXIT FULLSCREEN';
    if (fullscreenMode.matches) return 'FULLSCREEN / APP';
    if (appMode() && !root.requestFullscreen && !root.webkitRequestFullscreen) return 'APP DISPLAY';
    return 'ENTER FULLSCREEN';
  };
  window.initialsjObserveFullscreen = function (callback) {
    observer = callback;
    lastFullscreen = null;
    lastDomFullscreen = null;
    positionControl();
  };
  function positionControl() {
    const fullscreen = window.initialsjIsFullscreen();
    const domFullscreen = !!activeElement();
    if (observer && (fullscreen !== lastFullscreen || domFullscreen !== lastDomFullscreen)) {
      lastFullscreen = fullscreen;
      lastDomFullscreen = domFullscreen;
      observer(fullscreen,domFullscreen);
    }
    root.classList.toggle('installed-game',appMode());
    control.setAttribute('aria-label',window.initialsjFullscreenLabel());
    if (!rect || control.hidden) return;
    const bounds = canvas.getBoundingClientRect();
    control.style.left = (bounds.left+rect.x*bounds.width)+'px';
    control.style.top = (bounds.top+rect.y*bounds.height)+'px';
    control.style.width = (rect.width*bounds.width)+'px';
    control.style.height = (rect.height*bounds.height)+'px';
  }
  window.initialsjFullscreenControl = function (enabled,x,y,width,height) {
    control.hidden = !enabled;
    rect = enabled ? {x,y,width,height} : null;
    positionControl();
  };
  window.initialsjToggleFullscreen = async function () {
    if (busy) return;
    busy = true;
    control.disabled = true;
    try {
      const request = root.requestFullscreen || root.webkitRequestFullscreen;
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (activeElement()) {
        if (exit) await exit.call(document);
        else showNotice('이 브라우저에서는 전체 화면을 해제할 수 없어요.');
      } else if (fullscreenMode.matches) {
        showNotice('설치된 게임은 기본 전체 화면으로 실행됩니다.');
      } else if (!request) {
        showNotice(appMode() ? '홈 화면 앱 모드입니다. 이 기기에서는 시스템 상태 막대가 남을 수 있어요.' : '이 브라우저는 전체 화면 전환을 지원하지 않아요. 홈 화면에 설치하면 주소창 없이 플레이할 수 있어요.');
      } else {
        await request.call(root,{navigationUI:'hide'});
      }
    } catch (_) {
      showNotice('전체 화면으로 전환할 수 없어요. 브라우저 설정을 확인해 주세요.');
    } finally {
      busy = false;
      control.disabled = false;
      positionControl();
      if (canvas.focus) canvas.focus({preventScroll:true});
    }
  };
  control.addEventListener('click',function (event) {
    event.preventDefault();
    event.stopPropagation();
    window.initialsjToggleFullscreen();
  });
  for (const name of ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','keydown','keyup']) {
    control.addEventListener(name,function (event) { event.stopPropagation(); });
  }
  for (const name of ['fullscreenchange','webkitfullscreenchange']) document.addEventListener(name,positionControl);
  for (const name of ['resize','appinstalled']) window.addEventListener(name,positionControl);
  for (const query of [fullscreenMode,standaloneMode]) {
    if (query.addEventListener) query.addEventListener('change',positionControl);
    else if (query.addListener) query.addListener(positionControl);
  }
  positionControl();
}());

// Android/browser Back stays inside the game until the main menu is reached.
(function () {
  const key = '__initialsjBack';
  let observer = null;
  let enabled = false;
  let atGuard = !!(window.history.state && window.history.state[key] === 'guard');
  function arm() {
    atGuard = true;
    if (window.history.state && window.history.state[key] === 'guard') return;
    window.history.pushState(Object.assign({}, window.history.state, {[key]:'guard'}), '', window.location.href);
  }
  window.initialsjSetBackEnabled = function (value) { enabled = !!value; };
  window.initialsjObserveBack = function (callback, active) {
    observer = callback;
    enabled = !!active;
    if (!observer) return;
    const state = window.history.state;
    if (!state || !state[key]) window.history.replaceState(Object.assign({}, state, {[key]:'base'}), '', window.location.href);
    arm();
  };
  window.addEventListener('popstate', function (event) {
    const fromGuard = atGuard;
    atGuard = !!(event.state && event.state[key] === 'guard');
    if (!event.state || event.state[key] !== 'base') return;
    // A bfcache-restored Forward visit must be allowed back into the game.
    // Only a Back traversal from our guard should dispatch a game action.
    if (!fromGuard) {
      if (observer) arm();
      return;
    }
    if (observer && enabled) {
      // Reuse one same-URL entry: a rapid second Back cannot escape mid-fade,
      // and driving/menu actions never add entries of their own.
      arm();
      const dialog = document.getElementById('install-dialog');
      if (dialog && dialog.open) dialog.close();
      else observer();
    } else {
      // At the root menu, leave normally without trapping the browser user.
      window.history.back();
    }
  });
}());

(function () {
	// Consoles and low-memory browsers can drop the GPU context while the game runs. The engine
	// cannot recover from that, so restart the page once or twice in a lighter rendering mode.
	const LITE = 'initialsjLite';
	const LOSSES = 'initialsjContextLosses';
	function read(key) { try { return window.sessionStorage.getItem(key); } catch (err) { return null; } }
	function write(key, value) { try { window.sessionStorage.setItem(key, value); } catch (err) { /* private mode */ } }
	window.initialsjLiteGraphics = function () {
		return /Xbox/i.test(navigator.userAgent) || read(LITE) === '1' || /[?&]lite=1/.test(window.location.search);
	};
	// A session that has been stable for a minute is not stuck in a restart loop.
	window.setTimeout(function () { write(LOSSES, '0'); }, 60000);
	const canvas = document.getElementById('canvas');
	const notice = document.getElementById('context-notice');
	const message = document.getElementById('context-message');
	document.getElementById('context-reload').addEventListener('click', function () { window.location.reload(); });
	canvas.addEventListener('webglcontextlost', function (event) {
		event.preventDefault();
		const losses = (parseInt(read(LOSSES), 10) || 0) + 1;
		write(LOSSES, String(losses));
		write(LITE, '1');
		notice.style.display = 'flex';
		if (losses <= 2) {
			message.textContent = '그래픽 메모리가 부족해 화면이 멈췄습니다. 절약 모드로 자동으로 다시 시작합니다...';
			window.setTimeout(function () { window.location.reload(); }, 1800);
		} else {
			message.textContent = '그래픽 메모리 부족이 계속됩니다. 다른 앱이나 탭을 닫은 뒤 다시 시작해 주세요.';
		}
	});
}());

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const loadingCard = document.getElementById('loading-card');
	const loadingLabel = document.getElementById('loading-label');
	const loadingPercent = document.getElementById('loading-percent');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';
	let engineStarted = false;
	let gameReady = false;
	// The engine starts before the first scene is built. Keep the loading screen until the
	// game reports its first drawn frames, with a fallback so a missing signal never hangs.
	window.initialsjGameReady = function () {
		gameReady = true;
		if (engineStarted) setStatusMode('hidden');
	};
	function engineDone() {
		engineStarted = true;
		if (gameReady) {
			setStatusMode('hidden');
			return;
		}
		loadingLabel.textContent = 'BUILDING THE WORLD';
		loadingPercent.textContent = 'ALMOST THERE';
		statusProgress.removeAttribute('value');
		statusProgress.removeAttribute('max');
		window.setTimeout(function () { setStatusMode('hidden'); }, 20000);
	}

	// The web runtime can reject its WASM download outside startGame's promise.
	// Listen only during startup so exhausted retries produce a visible notice.
	function onStartupRejection(event) {
		if (!initializing) return;
		event.preventDefault();
		displayFailureNotice(event.reason);
	}
	window.addEventListener('unhandledrejection', onStartupRejection);

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			window.removeEventListener('unhandledrejection', onStartupRejection);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loadingCard.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		if (!initializing) return;
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
		window.removeEventListener('unhandledrejection', onStartupRejection);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const percent = Math.min(100, Math.floor(current / total * 100));
					loadingPercent.textContent = percent + '%';
					loadingLabel.textContent = percent === 100 ? 'PREPARING YOUR RIDE' : 'LOADING YOUR NEXT DRIVE';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadingPercent.textContent = 'STARTING';
					loadingLabel.textContent = 'LOADING YOUR NEXT DRIVE';
				}
			},
		}).then(engineDone, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
