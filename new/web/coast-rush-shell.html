<!DOCTYPE html>
<!-- Adapted from the Godot Engine web shell (MIT); see assets/audio/GODOT-LICENSE.txt in the source distribution. -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#07111e">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body { color: #f3f8ff; background: #07111e; overflow: hidden; touch-action: none; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: $GODOT_SPLASH_COLOR; z-index: 2; }
#status-splash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#status-splash.show-image--false { display: none; }
#status-splash.use-filter--false { image-rendering: pixelated; }
#loading-card { position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); width: min(420px, 76vw); padding: 18px 22px; border: 1px solid #76dfff40; border-radius: 12px; background: #07111ee8; box-shadow: 0 10px 36px #0008, 0 0 30px #24baff12; }
.loading-meta { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 12px; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
#loading-percent { color: #66e5ff; font-variant-numeric: tabular-nums; white-space: nowrap; }
#status-progress { display: block; width: 100%; height: 6px; border: 0; border-radius: 6px; overflow: hidden; background: #263c51; color: #36dfff; accent-color: #36dfff; }
#status-progress::-webkit-progress-bar { background: #263c51; border-radius: 6px; }
#status-progress::-webkit-progress-value { background: linear-gradient(90deg,#168aff,#35dbff,#b2faff); border-radius: 6px; }
#status-progress::-moz-progress-bar { background: linear-gradient(90deg,#168aff,#35dbff,#b2faff); border-radius: 6px; }
#status-progress:indeterminate { background: linear-gradient(90deg,#263c51 0%,#36dfff 50%,#263c51 100%); background-size: 200% 100%; animation: load-sweep 1.6s linear infinite; }
#status-notice { display: none; position: relative; z-index: 1; max-width: 560px; margin: 24px; padding: 22px; border: 1px solid #ff987080; border-radius: 12px; color: #f5f8ff; background: #07111ef5; line-height: 1.5; overflow-wrap: anywhere; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
noscript { position: fixed; z-index: 3; bottom: 20px; left: 20px; right: 20px; padding: 16px; background: #07111e; text-align: center; }
@keyframes load-sweep { to { background-position: -200% 0; } }
@media (max-height: 500px) { #loading-card { bottom: max(12px, env(safe-area-inset-bottom)); padding: 11px 16px; } .loading-meta { margin-bottom: 8px; font-size: 10px; } }
@media (prefers-reduced-motion: reduce) { #status-progress { animation: none !important; } }
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status" role="status" aria-label="Loading Initial SJ Coast Rush">
			<h1 class="sr-only">Initial SJ — Coast Rush</h1>
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="Initial SJ Coast Rush — three cars on a coastal highway" fetchpriority="high">
			<div id="loading-card">
				<div class="loading-meta"><span id="loading-label">LOADING YOUR NEXT DRIVE</span><span id="loading-percent" aria-hidden="true">STARTING</span></div>
				<progress id="status-progress" aria-label="Game download progress"></progress>
			</div>
			<div id="status-notice" role="alert"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const loadingCard = document.getElementById('loading-card');
	const loadingLabel = document.getElementById('loading-label');
	const loadingPercent = document.getElementById('loading-percent');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	// The web runtime can reject its WASM download outside startGame's promise.
	// Listen only during startup so exhausted retries produce a visible notice.
	function onStartupRejection(event) {
		if (!initializing) return;
		event.preventDefault();
		displayFailureNotice(event.reason);
	}
	window.addEventListener('unhandledrejection', onStartupRejection);

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			window.removeEventListener('unhandledrejection', onStartupRejection);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loadingCard.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		if (!initializing) return;
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
		window.removeEventListener('unhandledrejection', onStartupRejection);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const percent = Math.min(100, Math.floor(current / total * 100));
					loadingPercent.textContent = percent + '%';
					loadingLabel.textContent = percent === 100 ? 'PREPARING YOUR RIDE' : 'LOADING YOUR NEXT DRIVE';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadingPercent.textContent = 'STARTING';
					loadingLabel.textContent = 'LOADING YOUR NEXT DRIVE';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
