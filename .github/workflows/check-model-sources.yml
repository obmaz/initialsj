name: GLB 원본과 생성물 검사

on:
  push:
    branches: [main]
    paths:
      - 'model_sources/**'
      - 'models/**'
      - 'tools/glb_geometry.py'
      - 'tools/optimize_models.py'
      - 'tools/test_optimize_models.py'
      - '.github/workflows/check-model-sources.yml'
  pull_request:
    paths:
      - 'model_sources/**'
      - 'models/**'
      - 'tools/glb_geometry.py'
      - 'tools/optimize_models.py'
      - 'tools/test_optimize_models.py'
      - '.github/workflows/check-model-sources.yml'

permissions:
  contents: read

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 원본 누락과 생성물 직접 수정 검사
        run: |
          python3 tools/optimize_models.py --check
          python3 -m unittest discover -s tools -p 'test_optimize_models.py'
