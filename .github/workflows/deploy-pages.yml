name: Deploy Racing Collection to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install legacy dependencies
        working-directory: legacy
        run: flutter pub get
      - name: Check legacy game
        working-directory: legacy
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
      - name: Build legacy game
        working-directory: legacy
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: flutter build web --release --base-href "/${REPOSITORY_NAME}/legacy/" --pwa-strategy=none
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Import and check new game
        run: |
          godot --headless --path new --editor --import --quit
          godot --headless --path new --script res://tests/race_test.gd
      - name: Assemble launcher and legacy game
        run: |
          mkdir -p build/site/legacy build/site/new
          cp -R site/. build/site/
          cp -R legacy/build/web/. build/site/legacy/
          touch build/site/.nojekyll
      - name: Export new game for Web
        run: godot --headless --path new --export-release Web ../build/site/new/index.html
      - name: Verify deployment structure
        run: |
          test -f build/site/index.html
          test -f build/site/legacy/flutter_bootstrap.js
          test -f build/site/new/index.wasm
          test -f build/site/new/index.pck
          test -f build/site/flutter_service_worker.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
