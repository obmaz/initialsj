name: Deploy Initial SJ to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned development tools
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Run the shared static checks
        run: python3 tools/check.py --static
      - name: Cache the pinned engine and Web templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/engines
            ~/.local/share/godot/export_templates
          key: ${{ runner.os }}-godot-web-${{ hashFiles('.godot-version', 'tools/setup_env.sh') }}
      - name: Prepare the shared Web environment
        run: ./tools/setup_env.sh --skip-import --templates web
      - name: Run the shared engine and bridge checks
        run: python3 tools/check.py --engine
      - name: Export game for Web
        run: |
          mkdir -p build/site
          ./tools/godot --headless --path . --export-release Web build/site/index.html
          cp web/retire-flutter-worker.js build/site/flutter_service_worker.js
          touch build/site/.nojekyll
      - name: Verify root deployment
        run: |
          test -f build/site/index.html
          test -f build/site/index.wasm
          test -f build/site/index.pck
          test -f build/site/index.manifest.json
          test -f build/site/index.service.worker.js
          test ! -d build/site/legacy
          test ! -d build/site/new
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - name: Keep failed check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-check-logs
          path: build/reports/checks
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
