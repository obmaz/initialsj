name: Deploy Initial SJ to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository references
        run: python3 tools/verify_repository.py
      - name: Read pinned Godot version
        id: godot_version
        run: echo "version=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_OUTPUT"
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot_version.outputs.version }}
          use-dotnet: false
          include-templates: true
      - name: Import and check game
        run: |
          godot --headless --path . --script res://tests/verify_engine.gd
          godot --headless --path . --editor --import --quit
          godot --headless --path . --script res://tools/check_models.gd
          godot --headless --fixed-fps 60 --path . --script res://tests/race_test.gd
          node tests/install_bridge_checks.cjs
          node tests/back_bridge_checks.cjs
          node tests/fullscreen_bridge_checks.cjs
          node tests/audio_lifecycle_checks.cjs
      - name: Export game for Web
        run: |
          mkdir -p build/site
          godot --headless --path . --export-release Web build/site/index.html
          cp web/retire-flutter-worker.js build/site/flutter_service_worker.js
          touch build/site/.nojekyll
      - name: Verify root deployment
        run: |
          test -f build/site/index.html
          test -f build/site/index.wasm
          test -f build/site/index.pck
          test -f build/site/index.manifest.json
          test -f build/site/index.service.worker.js
          test ! -d build/site/legacy
          test ! -d build/site/new
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
