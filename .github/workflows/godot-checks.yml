name: Godot game checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Check coding style and repository tools
        run: |
          python -m pip install -r tools/requirements-dev.txt
          gdformat --check scripts models addons tests tools
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Verify repository references
        run: python3 tools/verify_repository.py
      - name: Read pinned Godot version
        id: godot_version
        run: echo "version=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_OUTPUT"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot_version.outputs.version }}
          use-dotnet: false
          include-templates: false
      - name: Verify engine version
        run: godot --headless --path . --script res://tests/verify_engine.gd
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Check model contracts
        run: godot --headless --path . --script res://tools/check_models.gd
      - name: Check gameplay and browser bridges
        run: |
          godot --headless --fixed-fps 60 --path . --script res://tests/race_test.gd
          node tests/install_bridge_checks.cjs
          node tests/back_bridge_checks.cjs
          node tests/fullscreen_bridge_checks.cjs
          node tests/audio_lifecycle_checks.cjs
