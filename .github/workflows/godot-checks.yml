name: Godot prototype checks

on:
  push:
    paths: ['new/**', '.github/workflows/godot-checks.yml']
  pull_request:
    paths: ['new/**', '.github/workflows/godot-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path new --editor --import --quit
      - name: Check race rules
        run: godot --headless --path new --script res://tests/race_test.gd
