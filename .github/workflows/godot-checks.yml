name: Godot game checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Install pinned development tools
        run: python -m pip install -r tools/requirements-dev.txt
      - name: Run the shared static checks
        run: python3 tools/check.py --static
      - name: Keep failed check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-check-logs
          path: build/reports/checks
          retention-days: 7

  check:
    needs: source-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache the pinned Godot engine
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/engines
          key: ${{ runner.os }}-godot-${{ hashFiles('.godot-version', 'tools/setup_env.sh') }}
      - name: Prepare the shared environment
        run: ./tools/setup_env.sh --skip-import
      - name: Run the shared engine and bridge checks
        run: python3 tools/check.py --engine
      - name: Keep failed check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-check-logs
          path: build/reports/checks
          retention-days: 7
