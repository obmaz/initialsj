name: Godot prototype checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Check race rules and install bridge
        run: |
          godot --headless --path . --script res://tests/race_test.gd
          node tests/install_bridge_review.cjs
