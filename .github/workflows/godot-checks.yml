name: Godot game checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository references
        run: python3 tools/verify_repository.py
      - name: Read pinned Godot version
        id: godot_version
        run: echo "version=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_OUTPUT"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot_version.outputs.version }}
          use-dotnet: false
          include-templates: false
      - name: Verify engine version
        run: godot --headless --path . --script res://tests/verify_engine.gd
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Check gameplay and browser bridges
        run: |
          godot --headless --fixed-fps 60 --path . --script res://tests/race_test.gd
          node tests/install_bridge_review.cjs
          node tests/back_bridge_review.cjs
          node tests/fullscreen_bridge_review.cjs
          node tests/audio_lifecycle_review.cjs
