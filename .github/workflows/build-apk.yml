name: Build Android APK

# Runs only when started by hand: Actions > Build Android APK > Run workflow.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug = test key (tools/android-test.keystore); release = your keystore from repository secrets"
        type: choice
        options: [debug, release]
        default: debug
      publish:
        description: "Also publish the APK as a public GitHub release asset (apk-test or apk-release)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Only main may build (it holds the signing secrets and the public release)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this workflow from the main branch (it was started from $GITHUB_REF)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Read pinned Godot version
        id: godot_version
        run: echo "version=$(tr -d '[:space:]' < .godot-version)" >> "$GITHUB_OUTPUT"
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot_version.outputs.version }}
          use-dotnet: false
          include-templates: true
      - name: Verify repository references
        run: python3 tools/verify_repository.py
      - name: Import project
        run: godot --headless --path . --editor --import --quit
      - name: Cache the Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-${{ hashFiles('tools/build_android.sh') }}
      - name: Prepare the release keystore
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Add the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD first (docs/ANDROID.md)." >&2
            exit 1
          fi
          # Only the file path crosses steps; the alias and password go straight into the build step.
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "INITIALSJ_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the test APK
        if: inputs.build_type == 'debug'
        env:
          ANDROID_ACCEPT_LICENSES: "1"
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          tools/build_android.sh
          cp build/android/initialsj-debug.apk build/android/initialsj-test-upload.apk
      - name: Build the release APK
        if: inputs.build_type == 'release'
        env:
          ANDROID_ACCEPT_LICENSES: "1"
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          INITIALSJ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INITIALSJ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools/build_android.sh release
          cp build/android/initialsj-release.apk build/android/initialsj-release-upload.apk
      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: initialsj-${{ inputs.build_type }}-apk
          path: build/android/*-upload.apk
          retention-days: 30
      - name: Publish the APK as a release asset
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One release per kind: a test-signed and a release-signed APK use different keys and
          # cannot update each other, and each release's tag points at the commit that built it.
          if [ "${{ inputs.build_type }}" = "release" ]; then
            asset=build/android/initialsj-release-upload.apk; name=initialsj-release.apk; tag=apk-release
          else
            asset=build/android/initialsj-test-upload.apk; name=initialsj-test.apk; tag=apk-test
          fi
          cp "$asset" "build/android/$name"
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          notes="Android ${{ inputs.build_type }} APK built from commit ${GITHUB_SHA::7}."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes" --prerelease
          else
            gh release create "$tag" --title "Android APK ($tag)" --notes "$notes" --prerelease --verify-tag
          fi
          gh release upload "$tag" "build/android/$name" --clobber
